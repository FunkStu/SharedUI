# Primary path: publish @audere/ui to public npm (NPM_TOKEN).
# Legacy optional step: @audere-apps/ui on GitHub Packages (non-blocking; often fails on auth).
# New apps and Lovable should use npm only — see docs/LINKING_APPS_TO_AUDERE_UI.md.
#
# Bump version in packages/ui/package.json first, then either:
#   - Actions → "Publish UI to GitHub Packages" → Run workflow, or
#   - git tag ui/v0.3.7 && git push origin ui/v0.3.7
#
# Secrets:
#   NPM_TOKEN — automation token for registry.npmjs.org (@audere/ui)
#   GPR_PUBLISH_TOKEN — optional; classic PAT with write:packages for GitHub Packages

name: Publish UI to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish --dry-run only"
        type: boolean
        default: false
  push:
    tags:
      - "ui/v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ui-gpr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            packages/ui/package-lock.json

      # Platform components re-export from the demo app at repo root.
      - name: Install repo dependencies
        run: npm ci

      - name: Install package dependencies
        working-directory: packages/ui
        run: npm ci

      - name: Build package
        working-directory: packages/ui
        run: npm run build

      - name: Publish @audere/ui to npm
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/ui/v')
        working-directory: packages/ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret not set — skipping npm publish."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@audere-apps"

      - name: Publish @audere-apps/ui to GitHub Packages
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GPR_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
          SKIP_BUILD: "1"
        run: |
          set -e
          DRY=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY="--dry-run"
          fi
          node scripts/publish-github-packages.mjs $DRY
        working-directory: packages/ui
